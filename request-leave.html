<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Leave</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard-container">

        <h1>Request Leave</h1>

        <form id="leaveForm">

            <div id="message"></div>
            <br>

             <div class="form-row">
                <label for="leaveType">Leave Type</label>
                <select id="leaveType" required class="leaveType">
                    <option value="">Select leave type</option>
                    <option value="annual">Annual Leave</option>
                    <option value="sick">Sick Leave</option>
                    <option value="maternity">Maternity Leave</option>
                    <option value="parental">Parental Leave</option>
                    <option value="familyResponsibility">Family Responsibility Leave</option>
                    <option value="study">Study Leave</option>
                    <option value="birthday">Birthday Leave</option>
                    <option value="unpaid">Unpaid Leave</option>
                </select>
            </div>

            <div class="form-row">
                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" required class="dateSelector">
            </div>

            <div class="form-row">
                <label for="endDate">End Date</label>
                <input type="date" id="endDate" required class="dateSelector">
            </div>

            <div class="form-row">
                <label for="reason">Reason / Comments</label>
                <textarea id="reason" rows="4" required></textarea>
            </div>

            <div class="form-row">
                <label for="supportingDocument">
                    Supporting Document
                </label>
                <input type="file" id="supportingDocument">
            </div>

            <button type="button" id="calculateButton">
                Calculate Leave
            </button>

            <button type="button" id="cancelButton">
                Cancel
            </button>

        </form>

        <div id="leavePreview"></div>

        <button type="button" id="submitButton" style="display: none;">
            Submit Leave Request
        </button>

    </div>

        <script src="js/data.js"></script>
        <script src="js/storage.js"></script>
        <script src="js/app.js"></script>

</body>
</html>
